name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]  # numpy 2.5 requires >= 3.12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (no models, no network)
        run: pytest -m "not integration" -v

  integration:
    name: End-to-end (offline RAG with real models)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache embedding / reranker models
        uses: actions/cache@v4
        with:
          path: data/models
          key: models-${{ hashFiles('rag/config.py', 'rag/embeddings.py') }}
      - name: Integration tests
        run: pytest -m integration -v
      - name: App smoke test (Streamlit AppTest, offline mode)
        run: |
          python - <<'EOF'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=900).run()
          assert not at.exception, at.exception
          at.chat_input[0].set_value("Who was the first human in space?").run()
          assert not at.exception, at.exception
          answer = at.chat_message[-1].markdown[0].value
          print(answer)
          assert "[1]" in answer, "expected a cited offline answer"
          EOF
